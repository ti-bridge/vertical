<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#player {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
}

#video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    background: #000;
}

#controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 90px;

    display: flex;
    align-items: flex-end;
    justify-content: flex-end;

    padding: 0 25px 20px;
    box-sizing: border-box;

    background: linear-gradient(
        transparent,
        rgba(0, 0, 0, 0.65)
    );

    opacity: 0;
    transition: opacity 0.25s ease;

    pointer-events: none;
}

#player.controls-visible #controls {
    opacity: 1;
    pointer-events: auto;
}

#fullscreenBtn {
    width: 58px;
    height: 48px;

    border: none;
    border-radius: 5px;

    background: rgba(30, 30, 30, 0.85);

    color: #fff;

    font-size: 27px;
    line-height: 48px;

    cursor: pointer;
    outline: none;
}

#fullscreenBtn:hover,
#fullscreenBtn:focus {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(1.05);
}

/* =====================================================
   LOADING
   ===================================================== */

#loading {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background: #000;

    color: #fff;

    font-family: Arial, sans-serif;

    font-size: 22px;
}

#loading.hidden {
    display: none;
}

#loadingText {
    margin-bottom: 20px;
}

#loadingBar {
    width: 300px;
    height: 6px;

    background: #333;

    border-radius: 3px;

    overflow: hidden;
}

#loadingProgress {
    width: 0%;
    height: 100%;

    background: #fff;
}

</style>

</head>

<body>

<div id="player">

    <!-- =================================================
         CARREGAMENTO
         ================================================= -->

    <div id="loading">

        <div id="loadingText">
            Carregando vídeo...
        </div>

        <div id="loadingBar">

            <div id="loadingProgress"></div>

        </div>

    </div>


    <!-- =================================================
         VÍDEO
         ================================================= -->

    <video
        id="video"
        muted
        loop
        playsinline
        preload="auto">
    </video>


    <!-- =================================================
         CONTROLES
         ================================================= -->

    <div id="controls">

        <button
            id="fullscreenBtn"
            type="button"
            aria-label="Tela cheia">

            ⛶

        </button>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
   ================================================= */

/*
 * O vídeo deve estar na mesma pasta
 * deste arquivo HTML.
 */

var VIDEO_FILE = "video_tizen.mp4";


/*
 * Nome do cache.
 *
 * Enquanto for v1, o vídeo será reutilizado
 * do cache da TV.
 */

var CACHE_NAME = "video-cache-v1";


/* =====================================================
   ELEMENTOS
   ===================================================== */

var player =
    document.getElementById("player");

var video =
    document.getElementById("video");

var fullscreenBtn =
    document.getElementById("fullscreenBtn");

var loading =
    document.getElementById("loading");

var loadingText =
    document.getElementById("loadingText");

var loadingProgress =
    document.getElementById("loadingProgress");


/* =====================================================
   URL DO VÍDEO
   ===================================================== */

var VIDEO_URL =
    new URL(
        VIDEO_FILE,
        window.location.href
    ).href;


/* =====================================================
   BLOB URL
   ===================================================== */

var blobUrl = null;


/* =====================================================
   PROGRESSO
   ===================================================== */

function setProgress(percent) {

    if (percent < 0) {
        percent = 0;
    }

    if (percent > 100) {
        percent = 100;
    }

    loadingProgress.style.width =
        percent + "%";

}


/* =====================================================
   LOADING
   ===================================================== */

function showLoading(text) {

    loadingText.textContent = text;

    loading.classList.remove(
        "hidden"
    );

}


function hideLoading() {

    loading.classList.add(
        "hidden"
    );

}


/* =====================================================
   REPRODUZIR BLOB
   ===================================================== */

function playBlob(blob) {

    console.log(
        "Blob recebido:",
        blob.size,
        "bytes"
    );


    if (
        !blob ||
        blob.size === 0
    ) {

        throw new Error(
            "Blob vazio."
        );

    }


    /*
     * Libera Blob URL anterior.
     */

    if (blobUrl) {

        try {

            URL.revokeObjectURL(
                blobUrl
            );

        } catch (e) {}

    }


    /*
     * Cria URL local.
     */

    blobUrl =
        URL.createObjectURL(
            blob
        );


    /*
     * O vídeo passa a usar
     * o Blob local.
     */

    video.src = blobUrl;

    video.load();


    /*
     * Aguarda o vídeo ficar pronto.
     */

    video.oncanplay = function() {

        video.play()
            .then(function() {

                console.log(
                    "Vídeo reproduzindo."
                );

                hideLoading();

            })
            .catch(function(error) {

                console.log(
                    "Erro no play:",
                    error
                );

            });

    };

}


/* =====================================================
   DOWNLOAD DO VÍDEO
   ===================================================== */

async function downloadVideo(cache) {

    showLoading(
        "Baixando vídeo..."
    );

    setProgress(0);


    console.log(
        "Baixando vídeo:"
    );

    console.log(
        VIDEO_URL
    );


    /*
     * Faz o download.
     */

    var response =
        await fetch(
            VIDEO_URL
        );


    console.log(
        "HTTP:",
        response.status
    );


    if (!response.ok) {

        throw new Error(
            "Erro HTTP " +
            response.status
        );

    }


    /*
     * IMPORTANTE:
     *
     * O clone precisa ser feito
     * antes de response.blob().
     */

    var responseForCache =
        response.clone();


    /*
     * Salva o arquivo no Cache Storage.
     */

    await cache.put(
        VIDEO_URL,
        responseForCache
    );


    console.log(
        "Vídeo salvo no cache."
    );


    setProgress(50);


    /*
     * Converte o arquivo para Blob.
     */

    var blob =
        await response.blob();


    setProgress(100);


    console.log(
        "Download concluído:",
        blob.size,
        "bytes"
    );


    return blob;

}


/* =====================================================
   CARREGAR VÍDEO
   ===================================================== */

async function loadVideo() {

    try {

        /*
         * Verifica se Cache Storage existe.
         */

        if (!window.caches) {

            throw new Error(
                "Cache Storage não suportado."
            );

        }


        /*
         * Abre o cache.
         */

        var cache =
            await caches.open(
                CACHE_NAME
            );


        /*
         * Procura o vídeo.
         */

        var cachedResponse =
            await cache.match(
                VIDEO_URL
            );


        /* =================================================
           VÍDEO JÁ ESTÁ NO CACHE
           ================================================= */

        if (cachedResponse) {

            console.log(
                "Vídeo encontrado no cache."
            );


            showLoading(
                "Carregando vídeo..."
            );


            setProgress(100);


            var cachedBlob =
                await cachedResponse.blob();


            playBlob(
                cachedBlob
            );


            return;

        }


        /* =================================================
           PRIMEIRA EXECUÇÃO
           ================================================= */

        console.log(
            "Vídeo não está no cache."
        );


        var downloadedBlob =
            await downloadVideo(
                cache
            );


        playBlob(
            downloadedBlob
        );


    } catch (error) {

        console.log(
            "ERRO AO CARREGAR VÍDEO:"
        );

        console.log(
            error
        );


        loadingText.textContent =
            "Erro ao carregar vídeo";


        setProgress(0);

    }

}


/* =====================================================
   ERRO DO VÍDEO
   ===================================================== */

video.addEventListener(
    "error",
    function() {

        console.log(
            "ERRO NO ELEMENTO VIDEO:"
        );

        console.log(
            video.error
        );

    }
);


/* =====================================================
   LOOP
   ===================================================== */

video.loop = true;


/* =====================================================
   CONTROLES
   ===================================================== */

var hideControlsTimer;


/* =====================================================
   ALTERAÇÃO:
   Timer separado para esconder o ponteiro da TV.
   ===================================================== */

var hideCursorTimer;


function showControls() {

    player.classList.add(
        "controls-visible"
    );


    clearTimeout(
        hideControlsTimer
    );


    hideControlsTimer =
        setTimeout(
            function() {

                player.classList.remove(
                    "controls-visible"
                );

            },
            3000
        );


    /* =================================================
       ALTERAÇÃO:
       Esconde o ponteiro depois de 3 segundos sem
       movimento, mas somente quando estiver em
       tela cheia.
       ================================================= */

    clearTimeout(
        hideCursorTimer
    );


    if (
        document.fullscreenElement ||
        document.webkitFullscreenElement
    ) {

        document.body.style.cursor =
            "default";


        hideCursorTimer =
            setTimeout(
                function() {

                    document.body.style.cursor =
                        "none";

                },
                3000
            );

    } else {

        document.body.style.cursor =
            "default";

    }

}


document.addEventListener(
    "mousemove",
    function() {

        showControls();

    }
);


document.addEventListener(
    "pointermove",
    function() {

        showControls();

    }
);


document.addEventListener(
    "touchstart",
    function() {

        showControls();

    }
);


/* =====================================================
   TELA CHEIA
   ===================================================== */

function enterFullscreen() {

    var request =
        player.requestFullscreen ||
        player.webkitRequestFullscreen;


    if (request) {

        request.call(
            player
        );

    }

}


function exitFullscreen() {

    var exit =
        document.exitFullscreen ||
        document.webkitExitFullscreen;


    if (exit) {

        exit.call(
            document
        );

    }

}


fullscreenBtn.addEventListener(
    "click",
    function() {

        if (
            document.fullscreenElement ||
            document.webkitFullscreenElement
        ) {

            exitFullscreen();

        } else {

            enterFullscreen();

        }

        showControls();

    }
);


/* =====================================================
   CONTROLE REMOTO
   ===================================================== */

fullscreenBtn.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" ||
            event.key === " " ||
            event.keyCode === 13 ||
            event.keyCode === 32
        ) {

            event.preventDefault();

            fullscreenBtn.click();

        }

    }
);


/* =====================================================
   ESTADO DA TELA CHEIA
   ===================================================== */

function updateFullscreenButton() {

    var fullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;


    if (fullscreen) {

        fullscreenBtn.setAttribute(
            "aria-label",
            "Sair da tela cheia"
        );


        /* =================================================
           ALTERAÇÃO:
           Ao entrar em tela cheia, começa a contagem
           para esconder o ponteiro da TV.
           ================================================= */

        clearTimeout(
            hideCursorTimer
        );


        document.body.style.cursor =
            "default";


        hideCursorTimer =
            setTimeout(
                function() {

                    document.body.style.cursor =
                        "none";

                },
                3000
            );


    } else {

        fullscreenBtn.setAttribute(
            "aria-label",
            "Tela cheia"
        );


        /* =================================================
           ALTERAÇÃO:
           Ao sair da tela cheia, o ponteiro volta a
           ficar visível normalmente.
           ================================================= */

        clearTimeout(
            hideCursorTimer
        );


        document.body.style.cursor =
            "default";

    }

}


document.addEventListener(
    "fullscreenchange",
    updateFullscreenButton
);


document.addEventListener(
    "webkitfullscreenchange",
    updateFullscreenButton
);


/* =====================================================
   LIMPAR BLOB
   ===================================================== */

window.addEventListener(
    "beforeunload",
    function() {

        if (blobUrl) {

            try {

                URL.revokeObjectURL(
                    blobUrl
                );

            } catch (e) {}

        }

    }
);


/* =====================================================
   ALTERAÇÃO: ATUALIZAÇÃO AUTOMÁTICA DO VÍDEO
   =====================================================

   Verifica o servidor nos horários:

   09:00
   11:00
   13:00

   O vídeo atual continua reproduzindo enquanto o novo
   arquivo é baixado.

   Se não existir vídeo novo, nada é alterado.

   Se existir vídeo novo, ele somente será colocado no
   player depois que o download estiver completamente
   concluído.

   A página não é recarregada e o fullscreen não é
   alterado.
   ===================================================== */


/* =====================================================
   CONTROLE PARA EVITAR DOIS DOWNLOADS AO MESMO TEMPO
   ===================================================== */

var updatingVideo = false;


/* =====================================================
   VERIFICAR E ATUALIZAR VÍDEO
   ===================================================== */

async function checkForNewVideo() {

    if (updatingVideo) {

        console.log(
            "Atualização já está em andamento."
        );

        return;

    }


    try {

        updatingVideo = true;


        console.log(
            "Verificando se existe vídeo novo..."
        );


        /*
         * Abre o cache atual.
         */

        var cache =
            await caches.open(
                CACHE_NAME
            );


        /*
         * Adiciona um parâmetro de consulta
         * para impedir que a requisição seja
         * atendida por uma versão HTTP antiga.
         *
         * O arquivo real continua sendo
         * VIDEO_FILE.
         */

        var updateURL =
            VIDEO_URL +
            "?update=" +
            Date.now();


        /*
         * Faz a requisição do servidor.
         *
         * O vídeo atual NÃO é alterado neste momento.
         */

        var response =
            await fetch(
                updateURL,
                {
                    cache: "no-store"
                }
            );


        console.log(
            "Verificação HTTP:",
            response.status
        );


        /*
         * Se o servidor não encontrou o arquivo
         * ou respondeu com erro, mantém o vídeo
         * atual sem qualquer interrupção.
         */

        if (!response.ok) {

            console.log(
                "Nenhum vídeo novo encontrado."
            );

            return;

        }


        /*
         * Converte o novo arquivo para Blob.
         *
         * O vídeo atual continua tocando
         * durante todo esse processo.
         */

        var newBlob =
            await response.blob();


        /*
         * Verifica se o arquivo recebido
         * realmente possui conteúdo.
         */

        if (
            !newBlob ||
            newBlob.size === 0
        ) {

            console.log(
                "Vídeo novo vazio. Mantendo vídeo atual."
            );

            return;

        }


        console.log(
            "Novo vídeo baixado:",
            newBlob.size,
            "bytes"
        );


        /*
         * Salva o novo vídeo no Cache Storage.
         */

        var responseForCache =
            new Response(
                newBlob,
                {
                    status: 200,
                    statusText: "OK",
                    headers: {
                        "Content-Type":
                            response.headers.get(
                                "Content-Type"
                            ) ||
                            "video/mp4"
                    }
                }
            );


        await cache.put(
            VIDEO_URL,
            responseForCache
        );


        console.log(
            "Novo vídeo salvo no cache."
        );


        /*
         * Guarda o estado de tela cheia.
         *
         * Não vamos sair da tela cheia.
         * Essa verificação existe somente para
         * garantir que a troca do vídeo não tente
         * alterar esse estado.
         */

        var wasFullscreen =
            document.fullscreenElement ||
            document.webkitFullscreenElement;


        /*
         * Guarda o estado de reprodução.
         */

        var wasPlaying =
            !video.paused;


        /*
         * Cria uma nova URL Blob diretamente
         * para o vídeo novo.
         */

        var newBlobUrl =
            URL.createObjectURL(
                newBlob
            );


        /*
         * Guarda a URL Blob anterior.
         */

        var oldBlobUrl =
            blobUrl;


        /*
         * Atualiza a variável para apontar
         * para o novo vídeo.
         */

        blobUrl =
            newBlobUrl;


        /*
         * Remove o evento antigo de canplay
         * para que a troca automática não
         * execute o comportamento inicial
         * de loadVideo().
         */

        video.oncanplay = null;


        /*
         * Coloca o novo vídeo no elemento.
         */

        video.src =
            newBlobUrl;


        video.load();


        /*
         * Quando o novo vídeo estiver pronto,
         * começa a reprodução.
         */

        video.oncanplay =
            function() {

                video.oncanplay = null;


                if (wasPlaying) {

                    video.play()
                        .then(function() {

                            console.log(
                                "Novo vídeo reproduzindo."
                            );

                        })
                        .catch(function(error) {

                            console.log(
                                "Erro ao reproduzir vídeo novo:",
                                error
                            );

                        });

                }


                /*
                 * Libera a URL Blob anterior
                 * somente depois que o novo vídeo
                 * estiver pronto.
                 */

                if (oldBlobUrl) {

                    try {

                        URL.revokeObjectURL(
                            oldBlobUrl
                        );

                    } catch (e) {}

                }


                /*
                 * Garante que o estado de fullscreen
                 * continue exatamente como estava.
                 */

                if (wasFullscreen) {

                    console.log(
                        "Fullscreen mantido."
                    );

                }

            };


        console.log(
            "Vídeo atualizado sem recarregar a página."
        );


    } catch (error) {

        /*
         * Qualquer erro durante a verificação ou
         * download mantém o vídeo atual.
         */

        console.log(
            "ERRO AO VERIFICAR VÍDEO NOVO:"
        );

        console.log(
            error
        );


    } finally {

        updatingVideo = false;

    }

}


/* =====================================================
   ALTERAÇÃO: VERIFICAÇÃO DOS HORÁRIOS
   =====================================================

   A cada minuto verifica o horário atual.

   Quando chegar em 09:00, 11:00 ou 13:00,
   executa a verificação apenas uma vez naquele horário.
   ===================================================== */

var lastUpdateCheck =
    "";


function checkUpdateSchedule() {

    var now =
        new Date();


    var hours =
        now.getHours();


    var minutes =
        now.getMinutes();


    var scheduleKey =
        now.getFullYear() +
        "-" +
        now.getMonth() +
        "-" +
        now.getDate() +
        "-" +
        hours +
        "-" +
        minutes;


    /*
     * Só executa nos horários definidos.
     */

    if (
        (
            hours === 9 ||
            hours === 11 ||
            hours === 13
        ) &&
        minutes === 0
    ) {

        /*
         * Evita repetir a mesma verificação
         * várias vezes durante o mesmo minuto.
         */

        if (
            lastUpdateCheck ===
            scheduleKey
        ) {

            return;

        }


        lastUpdateCheck =
            scheduleKey;


        checkForNewVideo();

    }

}


/* =====================================================
   ALTERAÇÃO: INICIA O AGENDAMENTO
   =====================================================

   Verifica imediatamente e depois verifica
   novamente a cada minuto.
   ===================================================== */

checkUpdateSchedule();


setInterval(
    checkUpdateSchedule,
    60000
);


/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

player.classList.remove(
    "controls-visible"
);

video.muted = true;


/*
 * Inicia o carregamento.
 */

loadVideo();

</script>

</body>

</html>
